<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link href="./styles.css" rel="stylesheet">
    <script src="./scripts.js" defer></script>
</head>
<body>
    <main>
        <div class="game-space">
            <div class="controls">
                <div class="player-one">
                    <input type="text" placeholder="Player 1" id="player-one-name" name="player1-name">
                </div>
                <button class="play-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><title>play</title><path d="M8,5.14V19.14L19,12.14L8,5.14Z" /></svg>
                </button>
                <div class="player-two">
                    <input type="text" placeholder="Player 2" id="player-two-name" name="player2-name">
                </div>
            </div>

        </div>
        <footer>
            <h1>TIC-TAC-TOE</h1>
            <div class="author">
                <p>Daniel Macedo</p>
                <p id="nickname">biroveyou</p>
            </div>
        </footer>
    </main>
</body>
</html>
